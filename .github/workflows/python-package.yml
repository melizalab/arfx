name: Python tests
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        version: "latest"
        python-version: "3.13"
    # ruff is pinned in uv.lock, so CI and local development check against the
    # same version. --only-group dev skips h5py and numpy, which lint does not
    # need. Neither step depends on the interpreter: ruff's target-version
    # comes from pyproject.toml.
    - name: Install ruff
      run: uv sync --frozen --only-group dev
    - name: Check lints
      run: uv run --no-sync ruff check .
    - name: Check formatting
      run: uv run --no-sync ruff format --check .

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest, ubuntu-24.04, windows-latest]
        # can't do pypy - no support for h5py
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python-version: "3.14"  # windows fatal exception: access error
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        version: "latest"
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --frozen
    - name: Run tests
      run: uv run pytest        
